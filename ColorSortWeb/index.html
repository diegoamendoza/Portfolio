<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ColorSort</title>
    <style>
      body {
        padding: 0;
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000000;
      }

      #unity-canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=308 height=658 tabindex="-1" style="width: 308px; height: 658px; background: #000000"></canvas>
    <script src="Build/ColorSortWeb.loader.js"></script>
    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      } else {
        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/ColorSortWeb.data",
        frameworkUrl: "Build/ColorSortWeb.framework.js",
        codeUrl: "Build/ColorSortWeb.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Kuden Games",
        productName: "ColorSort",
        productVersion: "0.1",
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
