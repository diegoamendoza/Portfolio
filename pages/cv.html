<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, follow">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../css/style.css">
    <title>CV - Diego Mendoza</title>
    <style>
        :root {
            --bg: #fafafa;
            --toolbar: #f3f3f3;
            --btn: #2d6cdf;
            --btn-text: #fff
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui,Segoe UI,Roboto,Arial
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            background: var(--toolbar);
        }

        .title {
            font-weight: 600
        }

        .spacer {
            flex: 1
        }

        .viewer {
            flex: 1;
            background: #ddd;
            display: block;
            min-height: 0
        }
            /* min-height for flex children */
            .viewer embed, .viewer object, .viewer iframe {
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
            }

        .btn {
            background: var(--btn);
            color: var(--btn-text);
            border: 0;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .link {
            text-decoration: none;
            color: var(--btn-text);
        }

        .note {
            font-size: 12px;
            color: #666
        }

        /* Barra de acciones del visor */
        .cv-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #ece9d8;
            border-bottom: 1px solid #b7b19f;
        }

        .cv-btn {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 8px 16px;
            font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #10395f;
            text-decoration: none;
            background: linear-gradient(180deg, #ffffff 0%, #e9f0f9 60%, #d3e0ef 100%);
            border: 1px solid #7d9cbd;
            border-radius: 5px;
            cursor: pointer;
        }

        .cv-btn:hover {
            background: linear-gradient(180deg, #ffffff 0%, #f3f8ff 60%, #dfeaf7 100%);
        }

        .cv-btn:focus-visible {
            outline: 3px solid #f0a500;
            outline-offset: 2px;
        }

        .cv-btn--primary {
            color: #fff;
            background: linear-gradient(180deg, #3b82d6 0%, #1e5aa8 100%);
            border-color: #174a8c;
        }

        .cv-btn--primary:hover {
            background: linear-gradient(180deg, #4b92e6 0%, #1f63bb 100%);
        }

        @media (max-width:420px) {
            .cv-btn {
                flex: 1 1 140px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cv-actions">
            <!-- TODO (Diego): confirma que cv/Diego-Mendoza-CV.pdf es tu CV actualizado
                 (es el archivo que estaba en files/cv.pdf, sólo se renombró). -->
            <a class="cv-btn cv-btn--primary" id="dlBtn" href="../cv/Diego-Mendoza-CV.pdf" download="Diego-Mendoza-CV.pdf" data-translate="cv-download-pdf">Descargar CV (PDF)</a>
            <a class="cv-btn" id="openBtn" href="../cv/Diego-Mendoza-CV.pdf" target="_blank" rel="noopener" data-translate="cv-open">Abrir</a>
        </div>

        <div class="viewer" id="viewer">
            <!-- Embed principal (en navegadores compatibles mostrará el PDF) -->
            <embed id="pdfEmbed" src="../cv/Diego-Mendoza-CV.pdf" type="application/pdf">

            <!-- fallback object -->
            <object id="pdfObject" data="../cv/Diego-Mendoza-CV.pdf" type="application/pdf" aria-label="CV" style="display:none;">
                <p style="padding:12px; color:#222">
                    <span data-translate="cv-fallback">Tu navegador no puede mostrar PDFs dentro del visor.</span>
                    <a id="dlFallback" href="../cv/Diego-Mendoza-CV.pdf" target="_blank" rel="noopener" data-translate="cv-fallback-link">Haz clic aquí para descargar el CV</a>
                </p>
            </object>
        </div>
    </div>

    <script>
    // Sin visor de PDF integrado (p. ej. Chrome en Android) el <embed> queda en blanco:
    // en ese caso se muestra el aviso con el enlace de descarga.
    if (navigator.pdfViewerEnabled === false) {
      document.getElementById('pdfEmbed').remove();
      const obj = document.getElementById('pdfObject');
      obj.replaceWith(...obj.children);
    }
    </script>
    <script src="../js/language.js"></script>
    <script src="../js/window-frame.js"></script>
</body>
</html>
